<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIM AI tool for ramada</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SCREEN 1: The Secure Login Gate -->
    <div id="login-screen" class="login-container">
        <div class="login-box">
            <h1>Ramada Medical AI Assistant</h1>
            <p class="slogan">Innovation is the Future</p>
            <input type="password" id="access-pin" placeholder="Enter Access Password..." onkeypress="handleLoginPress(event)">
            <button class="login-btn" onclick="verifyLogin()">Enter Portal</button>
            <p id="error-msg" class="error-text" style="display: none;">كلمة المرور غير صحيحة</p>
        </div>
    </div>

    <!-- SCREEN 2: The Modern AI Chat Interface -->
    <div id="chat-screen" class="app-container" style="display: none;">
        
        <header class="ai-header">
            <div class="header-content">
                <div class="logo">rameda</div>
                <div class="ai-status">
                    <span class="status-dot"></span> AIM Online
                </div>
            </div>
        </header>

        <div class="chat-container" id="chat-box">
            <!-- AI Empty State / Welcome Screen -->
            <div class="welcome-screen" id="welcome-screen">
                <div class="ai-sparkle">✨</div>
                <h2>أهلاً بيك يا دكتور</h2>
                <p>أنا AIM، مساعدتك الطبية من راميدا. جاهزة لمناقشة ملفات X-Tension.</p>
                
                <div class="suggestion-chips">
                    <button onclick="sendQuickMessage('مريضة 65 سنة، سكر وضغط (الدرجة 2) وبداية اعتلال كلى. إيه دور إكس-تنشن بلس؟')">مريضة 65 سنة (سكر وضغط)</button>
                    <button onclick="sendQuickMessage('مريض 50 سنة بياخد Beta Blocker وبيشتكي من إرهاق (Asthenia).')">مريض 50 سنة (إرهاق من أدوية أخرى)</button>
                    <button onclick="sendQuickMessage('اشرح لي نتائج دراسة IRMA 2 و IDNT')">نتائج IRMA 2 و IDNT</button>
                </div>
            </div>
            <!-- Messages will be injected here -->
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="اكتب سؤالك أو السيناريو هنا..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
            <div class="disclaimer">AIM can make mistakes. Verify medical claims.</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
