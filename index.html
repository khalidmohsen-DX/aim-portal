<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIM - Rameda AI Medical Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SCREEN 1: The Secure Login Gate -->
    <div id="login-screen" class="login-container">
        <div class="login-box">
            <h1>Ramada Medical AI Assistant</h1>
            <p class="slogan">Innovation is the Future</p>
            <input type="password" id="access-pin" placeholder="Enter Access Password..." onkeypress="handleLoginPress(event)">
            <button class="login-btn" onclick="verifyLogin()">Enter Portal</button>
            <p id="error-msg" class="error-text" style="display: none;">كلمة المرور غير صحيحة</p>
        </div>
    </div>

    <!-- SCREEN 2: The Main Chat Application (Hidden by default) -->
    <div id="chat-screen" class="app-container" style="display: none;">
        <header class="rameda-header">
            <div class="logo-area">
                <h1>rameda</h1>
                <span class="slogan">Quality For All</span>
            </div>
            <div class="app-title">AIM Medical Assistant</div>
        </header>

        <!-- Medical Image Section -->
        <div class="profile-card">
            <!-- You can replace this link with your actual picture of the medical bill/pill -->
            <img src="https://via.placeholder.com/150x150.png?text=Medical+Bill" alt="Medical Image" class="avatar">
        </div>

        <div class="quick-actions">
            <button onclick="sendQuickMessage('محاكاة مكالمة دعائية: مريضة 65 سنة عندها سكر وضغط')">محاكاة مكالمة دكتور</button>
            <button onclick="sendQuickMessage('ما هي مميزات إكس-تنشن مقارنة بـ Beta-blockers؟')">مقارنة المنافسين</button>
            <button onclick="sendQuickMessage('اشرح لي نتائج دراسة IRMA 2 و IDNT')">الدراسات الإكلينيكية</button>
        </div>

        <div class="chat-container" id="chat-box">
            <!-- Chat will load here -->
        </div>

        <div class="input-container">
            <input type="text" id="user-input" placeholder="اكتب سؤالك أو السيناريو هنا..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
